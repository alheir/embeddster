[project]
name = "embeddster-gui"
version = "0.1.0"
description = "GUI de apoyo para el curso 25.27 - Sistemas Embebidos (ITBA)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "PyQt6",
    "PyOpenGL",
    "numpy",
    "pyrr",
    "pyserial",
    "pyqtgraph",
]

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "main.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/ui/mainwindow.py" = ["E501"]
